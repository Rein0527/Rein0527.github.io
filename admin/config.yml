locale: zh_Hant
backend:
  name: github
  repo: Rein0527/Rein0527.github.io
  branch: master
  base_url: https://YOUR-OAUTH-SITE.netlify.app
  auth_endpoint: auth

site_url: https://rein0527.github.io
display_url: https://rein0527.github.io
logo_url: https://rein0527.github.io
media_folder: assets/uploads
public_folder: /assets/uploads
publish_mode: simple

collections:
  - name: settings
    label: 網站設定
    files:
      - name: general
        label: 首頁與關於
        file: _data/settings.yml
        fields:
          - { label: 網站名稱, name: site_title, widget: string, required: false }
          - { label: 首頁大標題, name: intro_title, widget: string, required: false }
          - { label: 首頁簡介, name: intro_text, widget: text, required: false }
          - { label: 關於標題, name: about_title, widget: string, required: false }
          - { label: 關於內容, name: about_text, widget: markdown, required: false }
  - name: posts
    label: 日誌文章
    label_singular: 文章
    folder: _posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    editor:
      preview: true
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 發布日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: HH:mm }
      - { label: 分類, name: category, widget: string, required: false }
      - { label: 摘要, name: summary, widget: text, required: false }
      - { label: 封面圖片, name: cover, widget: image, required: false }
      - { label: 精選文章, name: featured, widget: boolean, default: false }
      - { label: 文章內容, name: body, widget: markdown }

