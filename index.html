<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="theme-color" content="#f3efe7">
  <title>Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container nav">
      <!-- 將 JOURNAL 改成你的網站名稱 -->
      <a class="brand" href="#top"><span class="brand-dot"></span><span>JOURNAL</span></a>
      <nav aria-label="主要導覽">
        <a href="#journal">日誌</a>
        <a href="#about">關於</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式">
          <span class="sun">☼</span><span class="moon">☾</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero container">
      <div class="hero-copy">
        <p class="eyebrow"><span></span> PERSONAL JOURNAL</p>
        <!-- 在 h1 與下方 p 內填入首頁標題和簡介 -->
        <h1 class="editable-space" aria-label="首頁標題預留位置"></h1>
        <p class="hero-description editable-space" aria-label="首頁簡介預留位置"></p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="orbit"></div>
        <div class="sun-shape"></div>
        <span class="art-index">00</span>
      </div>
    </section>

    <section class="journal container" id="journal">
      <div class="section-head">
        <div><p class="eyebrow"><span></span> JOURNAL</p><h2>日誌</h2></div>
      </div>

      <!--
        新增文章時，複製一個 article.post-card 區塊。
        目前只顯示空白模板卡，不含任何文章內容。
      -->
      <div class="post-grid" aria-label="文章版位">
        <article class="post-card placeholder-card" aria-label="文章版位一">
          <div class="card-visual"><span>01</span></div>
          <div class="card-body">
            <div class="placeholder-line short"></div>
            <div class="placeholder-line title"></div>
            <div class="placeholder-line"></div>
            <div class="placeholder-line medium"></div>
          </div>
        </article>
        <article class="post-card placeholder-card" aria-label="文章版位二">
          <div class="card-visual tone-sage"><span>02</span></div>
          <div class="card-body">
            <div class="placeholder-line short"></div>
            <div class="placeholder-line title"></div>
            <div class="placeholder-line"></div>
            <div class="placeholder-line medium"></div>
          </div>
        </article>
        <article class="post-card placeholder-card" aria-label="文章版位三">
          <div class="card-visual tone-lilac"><span>03</span></div>
          <div class="card-body">
            <div class="placeholder-line short"></div>
            <div class="placeholder-line title"></div>
            <div class="placeholder-line"></div>
            <div class="placeholder-line medium"></div>
          </div>
        </article>
      </div>
    </section>

    <section class="about" id="about">
      <div class="container about-grid">
        <div><p class="eyebrow"><span></span> ABOUT</p><h2>關於</h2></div>
        <!-- 在這個 div 內填入關於內容 -->
        <div class="about-placeholder" aria-label="關於內容預留位置">
          <div class="placeholder-line"></div>
          <div class="placeholder-line"></div>
          <div class="placeholder-line medium"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <span>© <span id="year"></span></span>
      <a href="#top">BACK TO TOP ↑</a>
    </div>
  </footer>

  <script>
    const root = document.documentElement;
    const button = document.querySelector('#theme-toggle');
    const savedTheme = localStorage.getItem('journal-theme');
    if (savedTheme) root.dataset.theme = savedTheme;
    button.addEventListener('click', () => {
      const theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = theme;
      localStorage.setItem('journal-theme', theme);
    });
    document.querySelector('#year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
